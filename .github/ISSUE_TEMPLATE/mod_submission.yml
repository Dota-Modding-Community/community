name: 🚀 Submit a Mod
description: Request to add your mod to the Dota 2 Minify Community Registry
title: "[Mod]: "
labels: ["mod-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting your mod to the Community Mods registry!
        Please ensure your repository follows the structure provided in [mod-template](https://github.com/Dota-Modding-Community/mod-template).

  - type: input
    id: mod_name
    attributes:
      label: Mod Name
      description: The display name of your mod.
      placeholder: "e.g. As-Is FoW"
    validations:
      required: true

  - type: input
    id: repo_url
    attributes:
      label: Repository URL
      description: Link to the GitHub repository hosting the mod.
      placeholder: "https://github.com/YourUsername/your-mod-repo"
    validations:
      required: true

  - type: input
    id: manifest_url
    attributes:
      label: Raw Manifest URL
      description: Direct URL to the raw manifest.json file.
      placeholder: "https://raw.githubusercontent.com/YourUsername/your-mod-repo/main/src/manifest.json"
    validations:
      required: true

  - type: input
    id: notes_url
    attributes:
      label: Raw Notes URL
      description: Direct URL to the raw notes.md file.
      placeholder: "https://raw.githubusercontent.com/YourUsername/your-mod-repo/main/src/notes.md"
    validations:
      required: true

  - type: input
    id: preview_url
    attributes:
      label: Raw Preview Image URL
      description: Direct URL to the raw preview image (webp, png, jpg, gif).
      placeholder: "https://raw.githubusercontent.com/YourUsername/your-mod-repo/main/src/preview.webp"
    validations:
      required: true

  - type: input
    id: download_url
    attributes:
      label: Latest Release Asset Download URL
      description: Direct URL to the latest .zip release asset.
      placeholder: "https://github.com/YourUsername/your-mod-repo/releases/latest/download/your-mod-name.zip"
    validations:
      required: true

  - type: input
    id: minify_versions
    attributes:
      label: Minify Version(s) Tested
      description: Which version(s) of Dota 2 Minify was this mod tested and working on?
      placeholder: "e.g. 1.13.1,2rc5"
    validations:
      required: true

  - type: checkboxes
    id: checklists
    attributes:
      label: Submission Checklist
      options:
        - label: I have tested this mod in Dota 2 Minify and verified it works without errors.
          required: true
        - label: The repository uses the automated release workflow (bundles src/ into a .zip).
          required: true
        - label: The preview image and notes render properly in the Minify UI.
          required: true

  - type: checkboxes
    id: terms_and_removal
    attributes:
      label: Registry Policy & Removal Acknowledgment
      description: By submitting this mod, you acknowledge and agree to the registry maintenance and safety terms.
      options:
        - label: I understand that mods may be delisted or removed from the registry at any time if they become abandoned, unmaintained, or broken after Dota 2 updates.
          required: true
        - label: I certify that this mod contains no malicious, harmful, deceptive, or policy-violating code/content.
          required: true
        - label: I understand that if this mod causes game crashes, security concerns, or unresolved breaking bugs, it may be pulled from the registry without prior notice.
          required: true
